[pytest]
# Tests import the service as `from src.main import app`. Nothing else puts
# the repository root on sys.path: there is no tests/__init__.py and no
# packaging config, so a bare `pytest` used to fail at collection while
# `python -m pytest` worked — the latter inserts the CWD, the former does not.
#
# CI and CLAUDE.md both use `python -m pytest`, so this was a trap for anyone
# typing the shorter command rather than a live break. Setting pythonpath
# makes both invocations work. Requires pytest >= 7.0 (pinned at 8.4.2).
pythonpath = .
testpaths = tests
