# Greeting text per language — business-owned configuration (AMB-001 ruling).
#
# This file is the ONLY source of greeting text. No greeting is hardcoded
# in src/, not even as an emergency default (plan.md research R-6):
# a code-side default would let some deployments answer from config and
# others from source, with nothing to reveal which, breaking GRT-004.
#
# `en` is required — the AMB-002 ruling makes English the default when a
# caller expresses no preference. The identifier is a constant in code;
# the text lives here.
#
# The languages below the default are illustrative. The real launch set is
# a business deliverable under AMB-001 and can change without code change.

locales:
  en: "Hello"
  fr: "Bonjour"
  de: "Hallo"
